name: Integration checks

on:
  push:
    branches:
      - main
      - 'integration/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Linux runners use an explicit image so ubuntu-latest migrations cannot
  # silently change the required checks (24.04/26.04 parity: PR #15).
  python-contracts:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile Python modules
        run: python -m compileall -q launch.py qwen38-27b/kernel glm53-flash/kernel glm53-flash/engine/glm53
      - name: Verify integration contracts
        run: python -m unittest discover -s tests -v
      - name: Syntax-check source sync automation
        run: bash -n scripts/propose_source_sync.sh

  frontend:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  companion-rust:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Run Rust unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  windows-installers:
    # Packaging is a non-release QA artifact; run only on integration PRs.
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'integration/')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build unsigned NSIS and MSI installers
        run: npm run tauri:build
      - name: Verify bundled installers exist
        shell: pwsh
        run: |
          $nsis = @(Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter '*.exe' -File -ErrorAction SilentlyContinue)
          $msi = @(Get-ChildItem -Path src-tauri/target/release/bundle/msi -Filter '*.msi' -File -ErrorAction SilentlyContinue)
          if ($nsis.Count -eq 0 -or $msi.Count -eq 0) {
            throw "Both an NSIS EXE and an MSI must be produced"
          }
          $nsis + $msi | Select-Object Name, Length | Format-Table
      - uses: actions/upload-artifact@v4
        with:
          name: companion-unsigned-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7

  glm-cpu-quant:
    # A bounded real JAX CPU layer, never starts TPU, model download or GCP.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install CPU-only GLM quantization test dependencies
        run: python -m pip install --disable-pip-version-check "jax[cpu]==0.10.2" gguf numpy pytest ml_dtypes
      - name: Exercise actual JAX quantization and GGUF reader tests
        env:
          PYTHONPATH: glm53-flash/engine
          XLA_FLAGS: --xla_force_host_platform_device_count=8
        run: python -m pytest -q -ra glm53-flash/engine/glm53/tests/test_gguf_reader.py glm53-flash/engine/glm53/tests/test_iqquant.py
