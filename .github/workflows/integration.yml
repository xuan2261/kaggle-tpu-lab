name: Integration checks

on:
  push:
    branches:
      - 'integration/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python modules
        run: python -m compileall -q launch.py qwen38-27b/kernel glm53-flash/kernel glm53-flash/engine/glm53
      - name: Verify integration contracts
        run: python -m unittest discover -s tests -v
      - name: Syntax-check source sync automation
        run: bash -n scripts/propose_source_sync.sh

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  companion-rust:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Run Rust unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  windows-installers:
    # Packaging is a non-release QA artifact; run only on integration PRs.
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'integration/')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build unsigned NSIS and MSI installers
        run: npm run tauri:build
      - name: Verify bundled installers exist
        shell: pwsh
        run: |
          $nsis = @(Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter '*.exe' -File -ErrorAction SilentlyContinue)
          $msi = @(Get-ChildItem -Path src-tauri/target/release/bundle/msi -Filter '*.msi' -File -ErrorAction SilentlyContinue)
          if ($nsis.Count -eq 0 -or $msi.Count -eq 0) {
            throw "Both an NSIS EXE and an MSI must be produced"
          }
          $nsis + $msi | Select-Object Name, Length | Format-Table
      - uses: actions/upload-artifact@v4
        with:
          name: companion-unsigned-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
