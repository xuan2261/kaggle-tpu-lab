<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="354" viewBox="0 0 1200 354" role="img" aria-labelledby="title desc">
  <title id="title">Kaggle TPU Lab system architecture</title>
  <desc id="desc">Four-stage flow: desktop Companion or Python CLI, Kaggle TPU v5e-8 running Qwen or GLM, a Cloudflare HTTPS endpoint, and developer clients. Status data is separate from authentication secrets.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#718796"/></marker>
    <linearGradient id="canvas" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fbfd"/><stop offset="1" stop-color="#edf3f6"/></linearGradient>
  </defs>
  <rect width="1200" height="354" rx="20" fill="url(#canvas)"/>
  <rect x="18" y="18" width="1164" height="318" rx="16" fill="#ffffff" stroke="#d6e3e9"/>
  <text x="46" y="57" font-family="Arial, sans-serif" font-size="22" font-weight="750" fill="#203745">HOW THE PIECES CONNECT</text>
  <text x="46" y="80" font-family="Arial, sans-serif" font-size="13.5" fill="#657985">A session-based serving workflow — not a permanently hosted API</text>
  <g font-family="Arial, sans-serif">
    <rect x="43" y="110" width="248" height="162" rx="14" fill="#f5f9fb" stroke="#b8d2df" stroke-width="1.5"/>
    <rect x="43" y="110" width="248" height="8" rx="4" fill="#20beff"/>
    <text x="62" y="145" font-size="12" font-weight="700" fill="#3d829a" letter-spacing="1.6">CONTROL</text>
    <text x="62" y="176" font-size="22" font-weight="700" fill="#1d3443">Windows / CLI</text>
    <text x="62" y="205" font-size="15" fill="#526b79">Companion tray app</text>
    <text x="62" y="226" font-size="15" fill="#526b79">or Python launcher</text>
    <text x="62" y="254" font-size="12" fill="#71818d">Submit • status • stop</text>
    <rect x="348" y="110" width="248" height="162" rx="14" fill="#f5f9fb" stroke="#b8d2df" stroke-width="1.5"/>
    <rect x="348" y="110" width="248" height="8" rx="4" fill="#ffc412"/>
    <text x="367" y="145" font-size="12" font-weight="700" fill="#a17b10" letter-spacing="1.6">COMPUTE</text>
    <text x="367" y="176" font-size="22" font-weight="700" fill="#1d3443">Kaggle TPU</text>
    <text x="367" y="205" font-size="15" fill="#526b79">v5e-8 • eight chips</text>
    <text x="367" y="226" font-size="15" fill="#526b79">Qwen3.8 / GLM-5.3</text>
    <text x="367" y="254" font-size="12" fill="#71818d">Inference kernel</text>
    <rect x="653" y="110" width="248" height="162" rx="14" fill="#f5f9fb" stroke="#b8d2df" stroke-width="1.5"/>
    <rect x="653" y="110" width="248" height="8" rx="4" fill="#20beff"/>
    <text x="672" y="145" font-size="12" font-weight="700" fill="#3d829a" letter-spacing="1.6">ACCESS</text>
    <text x="672" y="176" font-size="22" font-weight="700" fill="#1d3443">HTTPS endpoint</text>
    <text x="672" y="205" font-size="15" fill="#526b79">Cloudflare tunnel</text>
    <text x="672" y="226" font-size="15" fill="#526b79">Temporary URL + key</text>
    <text x="672" y="254" font-size="12" fill="#71818d">OpenAI / Anthropic APIs</text>
    <rect x="958" y="110" width="199" height="162" rx="14" fill="#f5f9fb" stroke="#b8d2df" stroke-width="1.5"/>
    <rect x="958" y="110" width="199" height="8" rx="4" fill="#ffc412"/>
    <text x="977" y="145" font-size="12" font-weight="700" fill="#a17b10" letter-spacing="1.6">CLIENTS</text>
    <text x="977" y="176" font-size="21" font-weight="700" fill="#1d3443">AI coding tools</text>
    <text x="977" y="205" font-size="15" fill="#526b79">Codex CLI</text>
    <text x="977" y="226" font-size="15" fill="#526b79">Claude Code</text>
    <text x="977" y="248" font-size="15" fill="#526b79">OpenCode</text>
  </g>
  <g stroke="#718796" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M294 191H344"/>
    <path d="M599 191H649"/>
    <path d="M904 191H954"/>
  </g>
  <rect x="43" y="288" width="1114" height="33" rx="9" fill="#eff8f7" stroke="#d1e9e6"/>
  <circle cx="62" cy="304" r="4.5" fill="#219c8a"/>
  <text x="76" y="310" font-family="Arial, sans-serif" font-size="13.5" fill="#2e6460">Sensitive keys stay in local session state; progress notifications exclude credentials.</text>
</svg>